  <!-- Bordure dorée subtile -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#C8A84B" stroke-width="1.5" opacity="0.5"/>
  <!-- Lettre P en Cormorant Garamond, dorée -->
  <text x="32" y="46"
        font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif"
        font-size="42"
